name: Release

# Publishes @qed-proof/sdk, then @qed-proof/cli (which pins that exact sdk version), on a sdk-js-v* tag, with npm
# provenance over OIDC. Trusted publishing must be configured for both packages first.

on:
  push:
    tags:
      - "sdk-js-v*"   # the tag the gated export writes (scripts/oss_export.py --package sdk-js)

permissions:
  contents: read

jobs:
  publish-sdk:
    environment: npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm 11.5.1+ (trusted publishing needs it; Node 20's npm 10 PUTs unauthenticated → E404)
        run: npm install -g npm@^11.5.1 && npm --version
      - run: npm ci
      - run: npm run build --workspace packages/sdk
      - run: npm test --workspace packages/sdk
      - run: npm publish --provenance --access public --workspace packages/sdk

  publish-cli:
    needs: publish-sdk
    environment: npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm 11.5.1+ (trusted publishing needs it; Node 20's npm 10 PUTs unauthenticated → E404)
        run: npm install -g npm@^11.5.1 && npm --version
      - run: npm ci
      - run: npm run build  # sdk first, then cli: the cli imports the sdk's built types
      - run: npm test --workspace packages/cli
      - run: npm publish --provenance --access public --workspace packages/cli

  github-release:
    # Creates (or refreshes) the GitHub Release for the tag once the package is on the registry; the release body is that
    # version's section of the changelog. Separate job so `contents: write` is held by nothing that publishes.
    needs: publish-cli
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create or update the GitHub Release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#sdk-js-v}"
          section() { awk -v v="$VERSION" 'BEGIN{h="## [" v "]"} index($0,h)==1{p=1;next} p&&(/^## \[/||/^\[[^]]+\]: http/){exit} p' "$1"; }
          { echo "## @qed-proof/sdk"; section packages/sdk/CHANGELOG.md; echo; echo "## @qed-proof/cli"; section packages/cli/CHANGELOG.md; } > notes.md
          grep -q '[^[:space:]]' <(section packages/sdk/CHANGELOG.md) || { echo "::error::no sdk CHANGELOG section for $VERSION"; exit 1; }
          grep -q '[^[:space:]]' <(section packages/cli/CHANGELOG.md) || { echo "::error::no cli CHANGELOG section for $VERSION"; exit 1; }
          gh release view "$TAG" >/dev/null 2>&1 && gh release edit "$TAG" --title "qed-proof JS $VERSION" --notes-file notes.md --latest \
            || gh release create "$TAG" --verify-tag --title "qed-proof JS $VERSION" --notes-file notes.md --latest
